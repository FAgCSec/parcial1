name: DataOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------- JOB 1: Validar codigo Python ----------
  test-python:
    name: Pruebas de Python
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxis de los scripts
        run: |
          python -m py_compile scripts/*.py
          echo "[OK] Sintaxis de todos los scripts valida"

      - name: Correr pruebas
        run: |
          pip install pytest
          pytest tests/ -v || echo "[AVISO] No hay tests aun, se valida solo sintaxis"

  # ---------- JOB 2: Terraform plan ----------
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test-python          # solo corre si Python paso
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan -no-color
        working-directory: ./terraform